<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cashy Beater 2.0.0</title>
<meta name="description" content="Cashy Beater 2.0.0 — earn Cashy, upgrade, and climb the leaderboard. Update by DataRonn.">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="logo.svg" type="image/svg+xml">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ============ AUTH ============ -->
  <section id="auth" class="screen">
    <button class="icon-btn fs-btn abs" data-act="fs" aria-label="Toggle fullscreen"><svg class="i"><use href="#i-maximize"/></svg></button>
    <div class="auth-wrap">
      <img class="logo-big" src="logo.svg" alt="Cashy Beater logo">
      <h1>Cashy <span>Beater</span></h1>
      <p class="sub">Earn Cashy. Beat everyone. Become <b class="gold">King</b>.</p>

      <div class="seg" role="tablist">
        <button class="on" data-auth="login" type="button">Login</button>
        <button data-auth="register" type="button">Create account</button>
      </div>

      <form id="authForm" autocomplete="on">
        <label>Username
          <input id="fUser" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="14" placeholder="3–14 letters, numbers, _" required>
        </label>
        <label>Password
          <input id="fPass" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="8+ characters for new accounts" required>
        </label>
        <div id="authErr" class="err" role="alert"></div>
        <button id="authBtn" class="btn primary" type="submit">Login</button>
        <button class="auth-link" type="button" data-act="forgot-password">Forgot password?</button>
      </form>

      <div id="modeNote" class="mode-note"></div>
      <div class="by">Version 2.0.0 · update by <b>DataRonn</b></div>
    </div>
  </section>

  <!-- ============ GAME ============ -->
  <section id="game" class="screen hidden">
    <header class="top">
      <div class="brand"><img src="logo.svg" alt=""><span>Cashy <b>Beater</b></span></div>
      <div id="tierChip" class="tierwrap"></div>
      <button class="icon-btn fs-btn" data-act="fs" aria-label="Toggle fullscreen"><svg class="i"><use href="#i-maximize"/></svg></button>
    </header>

    <main id="main">
      <!-- EARN -->
      <section class="tab on" id="tab-earn">
        <div class="balance">
          <small>Your balance</small>
          <div class="bigbal"><svg class="coinsvg sm"><use href="#i-coin"/></svg><span id="bal">0</span></div>
          <div class="rates"><span><svg class="i"><use href="#i-hand"/></svg>+<b id="perTap">1</b>/tap</span><span><svg class="i"><use href="#i-zap"/></svg>+<b id="perSec">0</b>/sec</span></div>
        </div>
        <div class="tapzone" id="tapzone">
          <div class="ring"></div>
          <button id="coinBtn" class="coin-btn" aria-label="Tap to earn Cashy"><svg class="coinsvg"><use href="#i-coin"/></svg></button>
          <div id="fx" class="fx"></div>
        </div>
        <div id="goal" class="goal"></div>
      </section>

      <!-- TASKS -->
      <section class="tab" id="tab-tasks"><div id="tasksBox"></div></section>

      <!-- SHOP -->
      <section class="tab" id="tab-shop"><div id="shopBox"></div></section>

      <!-- BOARD -->
      <section class="tab" id="tab-board"><div id="boardBox"></div></section>

      <!-- CHANGELOG -->
      <section class="tab" id="tab-updates"><div id="updatesBox"></div></section>

      <!-- ME + SETTINGS -->
      <section class="tab" id="tab-me"><div id="meBox"></div></section>
    </main>

    <nav class="nav">
      <button class="on" data-tab="earn"><svg class="i"><use href="#i-hand"/></svg><span>Earn</span></button>
      <button data-tab="tasks"><svg class="i"><use href="#i-tasks"/></svg><span>Tasks</span><i id="taskDot" class="dot hidden"></i></button>
      <button data-tab="shop"><svg class="i"><use href="#i-store"/></svg><span>Shop</span></button>
      <button data-tab="board"><svg class="i"><use href="#i-trophy"/></svg><span>Ranks</span></button>
      <button data-tab="updates"><svg class="i"><use href="#i-clock"/></svg><span>Updates</span></button>
      <button data-tab="me"><svg class="i"><use href="#i-user"/></svg><span>Me</span></button>
    </nav>
  </section>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
